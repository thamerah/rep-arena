// PROFILE LOADING — tries local first, falls back to example

let PROFILE = {
  DEGREE: "Pharm.D.",
  UNIVERSITY: "a Saudi university",
  HONORS: "with distinction",
  CURRENT_EMPLOYER: "a community pharmacy chain",
  MONTHS_EXPERIENCE: "several months",
};

try {
  const local = await import('./profile.local.js');
  PROFILE = local.PROFILE;
} catch {
  try {
    const example = await import('./profile.example.js');
    PROFILE = example.PROFILE;
  } catch {}
}

function resolveTokens(str) {
  return str
    .replace(/\{\{DEGREE\}\}/g, PROFILE.DEGREE)
    .replace(/\{\{UNIVERSITY\}\}/g, PROFILE.UNIVERSITY)
    .replace(/\{\{HONORS\}\}/g, PROFILE.HONORS)
    .replace(/\{\{CURRENT_EMPLOYER\}\}/g, PROFILE.CURRENT_EMPLOYER)
    .replace(/\{\{MONTHS_EXPERIENCE\}\}/g, PROFILE.MONTHS_EXPERIENCE);
}

function loadState(){
  try{const s=localStorage.getItem('repArenaState');if(s)return JSON.parse(s)}catch{}
  return defaultState();
}
function defaultState(){
  const cs={};
  CONTENT.flashCards.forEach(c=>{cs[c.id]={box:1,attempts:0,totalScore:0,lastSeen:0}});
  CONTENT.objections.forEach(o=>{cs[o.id]={attempts:0,totalScore:0,bestScore:0}});
  CONTENT.arabicDrill.forEach((_,i)=>{cs['ar_'+i]={box:1,attempts:0,totalScore:0,lastSeen:0}});
  return{xp:0,streak:0,lastPlayDate:null,cardStates:cs,gauntletBestRun:0,bossCompleted:false,bossBestTrust:0};
}
let S=loadState();
function save(){try{localStorage.setItem('repArenaState',JSON.stringify(S))}catch{}}
function addXP(n){S.xp+=n;save()}
function getLevel(){let l=CONTENT.levels[0];for(const x of CONTENT.levels)if(S.xp>=x.minXP)l=x;return l}
function getNextLevel(){const c=getLevel();const i=CONTENT.levels.indexOf(c);return i<CONTENT.levels.length-1?CONTENT.levels[i+1]:null}
function getXPPct(){const c=getLevel(),n=getNextLevel();if(!n)return 100;return Math.min(100,(S.xp-c.minXP)/(n.minXP-c.minXP)*100)}
function updateStreak(){
  const today=new Date().toISOString().split('T')[0];
  if(S.lastPlayDate===today)return;
  const yesterday=new Date(Date.now()-864e5).toISOString().split('T')[0];
  S.streak=S.lastPlayDate===yesterday?S.streak+1:1;
  S.lastPlayDate=today;save();
}
function getWeakSpots(){
  const items=[];
  CONTENT.flashCards.forEach(c=>{const s=S.cardStates[c.id];if(s&&s.attempts>0)items.push({id:c.id,type:'flash',label:c.question.slice(0,45)+'…',avg:s.totalScore/s.attempts,cat:c.category})});
  CONTENT.objections.forEach(o=>{const s=S.cardStates[o.id];if(s&&s.attempts>0)items.push({id:o.id,type:'objection',label:o.objection.slice(0,45)+'…',avg:s.totalScore/s.attempts,cat:'Objection'})});
  items.sort((a,b)=>a.avg-b.avg);return items.slice(0,5);
}
function ensureCardState(id,type){
  if(!S.cardStates[id]){
    S.cardStates[id]=type==='flash'||type==='arabic'?{box:1,attempts:0,totalScore:0,lastSeen:0}:{attempts:0,totalScore:0,bestScore:0};
    save();
  }
}

window._scoreFlash=(score)=>{

// ═══════════════════════════════════════════════════════
let GQ=[],GI=0,GPhase='',GTime=45,GUsed=0,GRun=0,GFast=false;

function startGauntlet(ids){
  GRun=0;GI=0;
  GQ=ids?CONTENT.objections.filter(o=>ids.includes(o.id)):[...CONTENT.objections].sort(()=>Math.random()-.5).slice(0,5);
  if(!GQ.length){showHome();return}
  GQ.forEach(o=>ensureCardState(o.id,'objection'));
  nextGauntlet();
}

function nextGauntlet(){
  GPhase='answering';GTime=45;GUsed=0;GFast=false;
  clearInterval(window._timerInterval);
  window._timerInterval=setInterval(()=>{
    GTime--;GUsed++;
    const el=document.getElementById('g-timer');
    if(el){el.textContent=GTime+'s';el.className=`text-4xl font-bold tabular-nums ${GTime<=10?'text-danger timer-pulse':'text-white'}`}
    const bar=document.getElementById('g-bar');
    if(bar)bar.style.width=(GTime/45*100)+'%';
    if(GTime<=0){clearInterval(window._timerInterval);GUsed=45;showGauntletScore()}
  },1000);
  renderGauntletQ();
}

function renderGauntletQ(){
  const o=GQ[GI];
  render(`${hdr(true)}

    render(`${hdr(true)}<main class="max-w-lg mx-auto px-4 py-10 text-center slide-up">

  let count=0;
  ['gc_ack','gc_ask','gc_piv','gc_evi','gc_cls','gc_cmp'].forEach(id=>{if(document.getElementById(id)?.checked)count++});
  let score=count*10+(GFast?10:0);
  GRun+=score;
  const o=GQ[GI],cs=S.cardStates[o.id];
  cs.attempts++;cs.totalScore+=score;cs.bestScore=Math.max(cs.bestScore||0,score);
  addXP(Math.round(score/2));
  window._nextGauntlet();
};

window._nextGauntlet=()=>{
  GI++;
  if(GI>=GQ.length){
    S.gauntletBestRun=Math.max(S.gauntletBestRun,GRun);save();
    const maxS=GQ.length*70,pct=Math.round(GRun/maxS*100);
    render(`${hdr(true)}<main class="max-w-lg mx-auto px-4 py-10 text-center slide-up">
      <div class="text-5xl mb-3">${pct>=80?'🏆':pct>=50?'💪':'📚'}</div>
      <h2 class="text-xl font-bold text-white mb-1">Gauntlet Complete!</h2>
      <div class="text-4xl font-bold ${pct>=80?'text-success':pct>=50?'text-warn':'text-danger'} my-2">${GRun} pts</div>
      <p class="text-sm text-muted mb-1">${pct}% of maximum</p>
      <p class="text-xs text-muted mb-6">Best run: ${S.gauntletBestRun} pts</p>
      <div class="space-y-3 max-w-xs mx-auto">
        <button onclick="_nav('gauntlet')" class="btn-action btn-primary">Run Again</button>
        <button onclick="_nav('home')" class="btn-action btn-secondary">Home</button>
      </div>
    </main>`);
  } else nextGauntlet();
};

window._scoreArabic=(score)=>{
  const p=AQ[AI],idx=CONTENT.arabicDrill.indexOf(p),id='ar_'+idx;

function drillWeakSpots(){

// KEYBOARD SHORTCUTS (enhancement only — all have tap equivalents)
// ═══════════════════════════════════════════════════════
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(e.code==='Space'){
    e.preventDefault();
    if(!FR&&FI<(FQ?.length||0))window._revealFlash();
    else if(!AR&&AI<(AQ?.length||0))window._revealArabic();
    else if(!MFR&&MPhase==='flash')document.querySelector('[onclick*="MFR=true"]')?.click();
  }
  if(e.key>='1'&&e.key<='4'){
    const s=parseInt(e.key);
    if(FR&&FI<(FQ?.length||0))window._scoreFlash(s);
    else if(AR&&AI<(AQ?.length||0))window._scoreArabic(s);
    else if(MFR&&MPhase==='flash')window._scoreMF(s);
  }
  if(e.code==='Enter'){
    if(GPhase==='answering'&&GI<(GQ?.length||0))window._gauntletDone();
    else if(MGPhase==='answering'&&MPhase==='gauntlet')window._mgDone();
  }
});
